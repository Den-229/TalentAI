services:
  postgres:
    image: postgres:16-alpine
    container_name: talentai_db_postgres
    environment:
      POSTGRES_DB: talentai_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - 5438:5432
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
